# Every model the app may download or run.
#
# source:            "hf:<repo>", "pypi:<package>", "github:<owner/repo>", "bundled:<package>",
#                    or "" when the exact repo/file is not chosen yet.
# license_verified:  false until someone has read the licence on the model card.
#                    Check a model card before relying on it.
# commercial_ok:     only matters if the app is ever sold.
# phase:             required by the format; not used to choose models.

