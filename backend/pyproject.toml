[project]
name = "stream-log"
version = "0.1.0"
description = "A timestamped list of what happened in a stream VOD, short enough to read at a minute per hour"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "psutil>=5.9",
    "yt-dlp>=2025.1",
    "onnxruntime",
    # Speech recognition, and on NVIDIA GPUs the CUDA 12 cuBLAS + cuDNN 9 DLLs it runs on.
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
stream-log = "stream_log.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
# Some nvidia-* releases ship Linux wheels only; make uv pick versions that install on Windows.
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
# Smart App Control blocks unsigned DLLs until Microsoft's cloud has seen them, which takes
# roughly 1-2 weeks after a release. Only resolve packages published at least two weeks before
# this date; move it forward (keeping the 2-week gap) when upgrading dependencies.
exclude-newer = "2026-10-24T00:00:00Z"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_log"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
